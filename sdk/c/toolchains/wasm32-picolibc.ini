[binaries]
c = ['clang', '--target=wasm32-unknown-unknown', '-matomics', '-mbulk-memory']
ar = 'llvm-ar'
strip = 'llvm-strip'

[host_machine]
system = 'none'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'

[properties]
needs_exe_wrapper = true

[built-in options]
c_args = ['-O2', '-ffunction-sections', '-fdata-sections', '-D__IEEE_LITTLE_ENDIAN']
c_link_args = ['-nostdlib']
