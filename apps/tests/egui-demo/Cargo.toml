[package]
name = "oos-egui-demo"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
egui = { version = "0.35.0", default-features = false }
oos-app = { path = "../../../sdk/rust/oos-app" }
oos-egui = { path = "../../../sdk/rust/oos-egui" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
