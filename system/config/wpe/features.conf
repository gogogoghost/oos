# One WPE capability profile for every OOS device. Keep platform/toolchain
# workarounds out of this file and in the corresponding build adapter.
# KaiOS applications are media-capable. These cover HTML media, AudioContext,
# MediaSource, getUserMedia/WebRTC, and MediaRecorder.
USE_GSTREAMER=ON
USE_GSTREAMER_GL=ON
ENABLE_VIDEO=ON
ENABLE_WEB_AUDIO=ON
ENABLE_WEB_RTC=ON
ENABLE_WEB_CODECS=OFF
ENABLE_MEDIA_STREAM=ON
ENABLE_MEDIA_RECORDER=ON
ENABLE_MEDIA_SOURCE=ON

# PDF.js and WebCodecs are not part of the KaiOS 2.5/3 application baseline.
ENABLE_PDFJS=OFF
ENABLE_XSLT=ON
USE_WOFF2=OFF

# Build products and host sandbox integration, not Web application APIs.
ENABLE_DOCUMENTATION=OFF
ENABLE_INTROSPECTION=OFF
ENABLE_JOURNALD_LOG=OFF
ENABLE_BUBBLEWRAP_SANDBOX=OFF
ENABLE_SPEECH_SYNTHESIS=OFF
ENABLE_SPELLCHECK=OFF

# KaiOS feature phones do not expose XR or gamepad hardware to applications.
ENABLE_WEBXR=OFF
ENABLE_GAMEPAD=OFF

# Browser-shell UI and development-only facilities are owned by OOS.
ENABLE_CONTENT_EXTENSIONS=OFF
ENABLE_CONTEXT_MENUS=OFF
ENABLE_CURSOR_VISIBILITY=ON
ENABLE_DRAG_SUPPORT=OFF
ENABLE_FULLSCREEN_API=ON
ENABLE_GEOLOCATION=ON
ENABLE_IMAGE_DIFF=OFF
ENABLE_JAVASCRIPT_SHELL=OFF
ENABLE_MATHML=ON
ENABLE_MEMORY_SAMPLER=OFF
ENABLE_OFFSCREEN_CANVAS=ON
ENABLE_OFFSCREEN_CANVAS_IN_WORKERS=ON
ENABLE_PERIODIC_MEMORY_MONITOR=OFF
ENABLE_REMOTE_INSPECTOR=ON
ENABLE_RESOURCE_USAGE=OFF
ENABLE_TOUCH_EVENTS=ON
ENABLE_VARIATION_FONTS=ON

# KaiOS 3 applications rely on modern JavaScript, WebAssembly, and WebGL. Keep
# the same engine tiers on local and ARMv7 builds; only FTL is unsupported on
# the target ARMv7 profile.
ENABLE_JIT=ON
ENABLE_DFG_JIT=ON
ENABLE_FTL_JIT=OFF
ENABLE_C_LOOP=OFF
ENABLE_SAMPLING_PROFILER=OFF
ENABLE_WEBASSEMBLY=ON
ENABLE_WEBGL=ON
ENABLE_NOTIFICATIONS=ON
ENABLE_MHTML=OFF
USE_CXX_STDLIB_ASSERTIONS=OFF
USE_SKIA_ENCODERS=OFF
USE_ATK=OFF
USE_LCMS=OFF
USE_AVIF=OFF
USE_GBM=OFF
USE_LIBHYPHEN=OFF
USE_LIBDRM=OFF
USE_JPEGXL=OFF
USE_LIBBACKTRACE=OFF
USE_SKIA_OPENTYPE_SVG=OFF
USE_SYSPROF_CAPTURE=OFF
ENABLE_WEBDRIVER=OFF
ENABLE_WPE_PLATFORM=ON
ENABLE_WPE_LEGACY_API=ON
ENABLE_WPE_PLATFORM_DRM=OFF
ENABLE_WPE_PLATFORM_WAYLAND=OFF
ENABLE_WPE_PLATFORM_HEADLESS=OFF
ENABLE_SWIFT_DEMO_URI_SCHEME=OFF
